name: release

# Pushing a tag such as v1.0.0 builds the binaries, attaches them to a GitHub
# release, and pushes the sidecar image with the same tag. Each binary comes
# with a software bill of materials, all of them with their checksums, and
# GitHub keeps a signed record that this workflow built them from the
# tagged commit. What came out is then tried the way the README says,
# after the record is checked, and built again elsewhere to see that the
# same bytes come out.
#
# Only what CI has checked is released: the tag must be on a commit of main
# on which the workflow "ci" passed.
on:
  push:
    tags: ["v*"]
  # By hand, a release that is already out is tried again: only the last
  # job runs.
  workflow_dispatch:
    inputs:
      version:
        description: The release to try, such as v1.0.0
        required: true

permissions:
  contents: write
  packages: write
  checks: read
  # The signed records of where each file and the image were built.
  id-token: write
  attestations: write
  artifact-metadata: write

defaults:
  run:
    shell: bash

env:
  # Not written into the commands below: a tag is text from outside.
  VERSION: ${{ inputs.version || github.ref_name }}

jobs:
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # All of the history: the next step asks whether main has the tag.
          fetch-depth: 0
      - name: The tag is on main, and CI passed there
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?check_name=ci" \
            --jq '.check_runs | map(.conclusion) | index("success")' | grep -x '[0-9][0-9]*'
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      - name: Build the binaries
        run: make dist VERSION="$VERSION"

      # Each binary has its own: the modules linked in differ by platform.
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        id: syft
      - name: A bill of materials for each binary
        run: |
          for binary in dist/scrim-*; do
            "$SYFT" scan "file:$binary" --output "spdx-json=$binary.spdx.json"
          done
        env:
          SYFT: ${{ steps.syft.outputs.cmd }}
      - name: Their checksums
        working-directory: dist
        run: sha256sum scrim-* > checksums.txt
      - name: A signed record of where they were built
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/scrim-*
            dist/checksums.txt

      # The notes begin with the release of Agones this one is compatible with.
      - name: Attach them to the release
        run: |
          agones=$(go list -m -f '{{.Version}}' agones.dev/agones)
          gh release create "$VERSION" dist/scrim-* dist/checksums.txt \
            --notes "Compatible with Agones $agones." --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # The image carries a bill of materials and the build's provenance of
      # its own, where image tools look for them.
      - name: Push the sidecar image for both architectures
        id: image
        run: |
          docker buildx build --platform linux/amd64,linux/arm64 --push \
            --sbom=true --provenance=mode=max --metadata-file image.json \
            --tag "ghcr.io/${GITHUB_REPOSITORY}-sidecar:${VERSION}" \
            --file build/sidecar/Dockerfile.release dist
          echo "digest=$(jq -r '."containerimage.digest"' image.json)" >> "$GITHUB_OUTPUT"
      - name: A signed record of where the image was built
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}-sidecar
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

  # The release, as someone who has just found it gets it: the binary from
  # the release page, and the sidecar image pulled without logging in, on a
  # machine that has seen neither. The build above was checked by CI; that
  # what was published is that build, and can be fetched, is checked here.
  # Releases before v0.3.0 have neither checksums nor signed records, and
  # fail here when they are tried again.
  quick-start:
    needs: release
    if: ${{ !cancelled() && (needs.release.result == 'success' || needs.release.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The binary of the release, checked as the README says
        run: |
          release="https://github.com/$GITHUB_REPOSITORY/releases/download/$VERSION"
          curl -fsSLO "$release/scrim-linux-amd64" -O "$release/checksums.txt"
          sha256sum --check --ignore-missing checksums.txt
          gh attestation verify scrim-linux-amd64 --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml"
          gh attestation verify "oci://ghcr.io/$GITHUB_REPOSITORY-sidecar:$VERSION" --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml"
          mv scrim-linux-amd64 scrim
          chmod +x scrim
          test "$(./scrim version)" = "scrim $VERSION"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: The quick start of the README
        run: build/ci/quickstart.sh ./scrim

  # The tagged commit, built again on another machine, gives the bytes that
  # checksums.txt has: a release is a build that anyone can make and
  # compare. Releases before v0.3.0 were not built with -trimpath, and fail
  # here when they are tried again.
  rebuild:
    needs: release
    if: ${{ !cancelled() && (needs.release.result == 'success' || needs.release.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.VERSION }}
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: The same bytes as the release
        run: |
          make dist VERSION="$VERSION"
          cd dist
          curl -fsSLO "https://github.com/$GITHUB_REPOSITORY/releases/download/$VERSION/checksums.txt"
          grep -v '\.spdx\.json$' checksums.txt | sha256sum --check
